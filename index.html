<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Simulator: Secuencia Perfecta</title>
    <style>
        /* --- ESTILOS BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* LAYOUT */
        .main-layout { display: flex; flex: 1; height: 100%; }
        .game-section { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        /* SIDEBAR */
        .stats-sidebar { width: 300px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border-left: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; display: flex; flex-direction: column; gap: 20px; color: white; box-shadow: -10px 0 30px rgba(0,0,0,0.3); z-index: 200; }
        .sidebar-title { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #bdc3c7; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 10px; }
        .metric-card { background: rgba(0, 0, 0, 0.3); border-radius: 15px; padding: 15px; position: relative; }
        .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .metric-label { font-size: 12px; font-weight: 600; color: #bdc3c7; }
        .metric-value { font-size: 16px; font-weight: bold; }
        .progress-track { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.5s ease; border-radius: 5px; }
        .fill-safe { background: #2ecc71; } .fill-warn { background: #f1c40f; } .fill-danger { background: #e74c3c; }

        /* GAME AREA */
        .game-area { flex: 1; position: relative; display: flex; justify-content: center; align-items: flex-end; perspective: 1200px; overflow: hidden; padding-bottom: 220px; }
        .floor { position: absolute; bottom: 0; left: -50%; width: 200%; height: 600px; background: repeating-linear-gradient(45deg, #34495e 0, #34495e 20px, #2c3e50 20px, #2c3e50 40px); transform: rotateX(70deg); transform-origin: bottom; z-index: 0; opacity: 0.5; }
        .queue-container { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; justify-content: center; height: 300px; width: 100%; z-index: 10; pointer-events: none; }
        
        /* CLIENTES */
        .customer { position: absolute; bottom: 0; width: 100px; height: 220px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        
        /* Posiciones Z-index para que se vean uno detrás de otro */
        .pos-0 { z-index: 50; transform: scale(1.2) translateY(20px); filter: brightness(1.1); } 
        .pos-1 { z-index: 49; transform: scale(1.0) translateY(-20px) translateX(60px); filter: brightness(0.9); opacity: 0.9; }
        .pos-2 { z-index: 48; transform: scale(0.9) translateY(-50px) translateX(110px); filter: brightness(0.8); opacity: 0.8; }
        .pos-3 { z-index: 47; transform: scale(0.85) translateY(-70px) translateX(150px); filter: brightness(0.7); opacity: 0.7; }
        .pos-4 { z-index: 46; transform: scale(0.8) translateY(-90px) translateX(180px); filter: brightness(0.6); opacity: 0.6; }
        
        /* Animación de Salida (El paso clave 3) */
        .customer.leaving {
            animation: leaveRight 0.5s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
            z-index: 100 !important; /* Pasa por enfrente */
        }
        @keyframes leaveRight {
            0% { transform: scale(1.2) translateY(20px); opacity: 1; }
            100% { transform: scale(1.3) translateY(50px) translateX(400px) rotate(10deg); opacity: 0; }
        }

        .c-body-group { position: relative; width: 80px; height: 160px; transition: transform 0.3s; }
        .c-head { width: 60px; height: 65px; background: #ffccaa; border-radius: 50%; position: absolute; top: 0; left: 10px; z-index: 2; }
        .c-torso { width: 80px; height: 90px; background: #3498db; border-radius: 20px 20px 0 0; position: absolute; top: 55px; left: 0; z-index: 1; }
        .c-eye { width: 8px; height: 8px; background: #333; border-radius: 50%; position: absolute; top: 25px; }
        .eye-l { left: 15px; } .eye-r { right: 15px; }
        .c-mouth { width: 20px; height: 5px; background: #333; border-radius: 10px; position: absolute; top: 45px; left: 20px; transition: all 0.3s; }

        /* Variaciones Visuales */
        .var-1 .c-torso { background: #e74c3c; } .var-1 .c-head { background: #f1c27d; }
        .var-2 .c-torso { background: #8e44ad; } .var-2 .c-head { background: #e0ac69; }
        .var-3 .c-torso { background: #27ae60; } .var-3 .c-head { background: #ffccaa; }

        /* Estados de Ánimo */
        .mood-angry .c-head { background: #ff7675; }
        .mood-angry .c-mouth { height: 15px; border-radius: 50%; top: 40px; }
        .mood-angry .c-body-group { animation: shake 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }

        /* BURBUJA DE PEDIDO (Paso clave 5) */
        .order-bubble { 
            position: absolute; top: -90px; right: -40px; 
            background: white; padding: 10px 20px; border-radius: 20px; 
            font-size: 35px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            border: 3px solid #333; z-index: 100; color: #333; 
            transform: scale(0); /* Empieza invisible */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .order-bubble::after { content: ''; position: absolute; bottom: -10px; left: 20px; border-width: 10px 10px 0; border-style: solid; border-color: #333 transparent transparent transparent; }

        /* CLASE PARA MOSTRAR BURBUJA */
        .pos-0 .order-bubble.show { transform: scale(1); }

        /* COCINA */
        .kitchen-panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: #2c3e50; border-top: 5px solid #34495e; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 100; box-shadow: 0 -10px 50px rgba(0,0,0,0.5); }
        .food-btn { width: 110px; height: 110px; background: #ecf0f1; border-radius: 20px; border: none; border-bottom: 8px solid #bdc3c7; font-size: 40px; cursor: pointer; transition: all 0.1s; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #333; position: relative; }
        .food-btn span { font-size: 12px; font-weight: bold; color: #7f8c8d; margin-top: 5px; text-transform: uppercase; }
        .food-btn:active { transform: translateY(4px); border-bottom-width: 4px; background: #dfe6e9; }
        
        /* Feedback y Header Stats */
        .top-header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: center; gap: 40px; z-index: 50; pointer-events: none; }
        .top-stat { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(5px); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .btn-start { padding: 15px 40px; font-size: 20px; background: #e67e22; border: none; color: white; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .hidden { display: none !important; }
        .feedback { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: 900; text-align: center; text-shadow: 0 5px 20px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; z-index: 200; }
        .feedback.good { color: #2ecc71; animation: feedbackUp 0.8s forwards; }
        .feedback.bad { color: #e74c3c; animation: feedbackShake 0.5s forwards; }
        @keyframes feedbackUp { 0% { opacity: 0; transform: translate(-50%, -30%); } 20% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -100%); } }
        @keyframes feedbackShake { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-60%, -50%); } 75% { transform: translate(-40%, -50%); } }

    </style>
</head>
<body>

    <div class="overlay" id="startScreen">
        <h1 style="color:white; font-size: 40px; margin-bottom: 10px;">👨‍🍳 Servicio Secuencial</h1>
        <p style="color:#bdc3c7; text-align: center; max-width: 500px; line-height: 1.6;">
            <strong>El Ciclo de Servicio:</strong><br>
            1. Mira el pedido 👀<br>
            2. Entrega la comida 🍔<br>
            3. El cliente se va 👋<br>
            4. El siguiente avanza 👣<br>
            5. ¡Repite!
        </p>
        <button class="btn-start" onclick="startGame()">Iniciar Servicio</button>
    </div>

    <div class="main-layout">
        <!-- SECCIÓN DE JUEGO -->
        <div class="game-section">
            <div class="top-header">
                <div class="top-stat">🕒 <span id="clock">11:00</span></div>
                <div class="top-stat">💰 <span id="money">$0</span></div>
            </div>

            <div class="game-area">
                <div class="floor"></div>
                <div class="queue-container" id="queueContainer"></div>
                <div style="position: absolute; bottom: 0; width: 100%; height: 20px; background: #7f8c8d; z-index: 50;"></div>
            </div>

            <div class="kitchen-panel">
                <button class="food-btn" onclick="serveOrder('🍔')">🍔<span>Burger</span></button>
                <button class="food-btn" onclick="serveOrder('🍟')">🍟<span>Papas</span></button>
                <button class="food-btn" onclick="serveOrder('🥤')">🥤<span>Soda</span></button>
                <button class="food-btn" onclick="serveOrder('🍦')">🍦<span>Helado</span></button>
            </div>
            
            <div id="feedbackDisplay" class="feedback"></div>
        </div>

        <!-- SIDEBAR DE ESTADÍSTICAS -->
        <aside class="stats-sidebar">
            <div class="sidebar-title">Métricas en Vivo</div>
            <div class="metric-card">
                <div class="metric-header"><div class="metric-label">👥 Fila</div><div class="metric-value" id="totalQueueVal">60</div></div>
                <div class="progress-track"><div class="progress-fill fill-safe" id="queueBar" style="width: 20%"></div></div>
            </div>
            <div class="metric-card" style="margin-top: 20px;">
                <div class="metric-header"><div class="metric-label">🍔 Hambre Prom.</div><div class="metric-value" id="hungerVal">0%</div></div>
                <div class="progress-track"><div class="progress-fill fill-safe" id="hungerBar" style="width: 0%"></div></div>
            </div>
            <div class="metric-card" style="margin-top: 20px;">
                <div class="metric-header"><div class="metric-label">😡 Estrés Total</div><div class="metric-value" id="stressVal">0%</div></div>
                <div class="progress-track"><div class="progress-fill fill-safe" id="stressBar" style="width: 0%"></div></div>
            </div>
        </aside>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const simulationData = [
            { minute: 0, queue: 60 }, { minute: 60, queue: 100 }, 
            { minute: 130, queue: 290 }, { minute: 180, queue: 240 }, 
            { minute: 290, queue: 0 }
        ];
        const MENU = ['🍔', '🍟', '🥤', '🍦'];

        // --- ESTADO ---
        let totalSeconds = 0; 
        let money = 0;
        let globalQueue = []; 
        let isAnimating = false; // Bloqueo para evitar spam de clics durante animaciones

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            // Generar fila inicial
            for(let i=0; i<60; i++) {
                let arrival = -Math.random() * 2400; 
                globalQueue.push(arrival);
            }
            globalQueue.sort((a,b) => a - b);
            updateVisualsFromQueue();
            updateStats();
        }

        function serveOrder(item) {
            if (isAnimating) return; // Bloquear inputs mientras hay animación
            
            // Buscar al cliente en posición 0 (Frente del mostrador)
            const currentEl = document.querySelector('.customer.pos-0');
            if (!currentEl) return;

            // Obtener el pedido guardado en el dataset del elemento HTML
            const expectedOrder = currentEl.dataset.order;

            if (item === expectedOrder) {
                // 1. FEEDBACK INMEDIATO
                money += 15;
                showFeedback("+$15", "good");
                
                // Bloquear juego para la secuencia cinemática
                isAnimating = true;

                // 2. ANIMACIÓN DE SALIDA (Cliente se va)
                currentEl.classList.add('leaving'); // CSS trigger

                // 3. ESPERAR Y AVANZAR (El "Ciclo")
                setTimeout(() => {
                    // a. Eliminar datos lógicos
                    globalQueue.shift();
                    
                    // b. Avanzar tiempo y calcular llegadas
                    advanceTime(30);

                    // c. Liberar bloqueo
                    isAnimating = false;

                }, 500); // Tiempo que tarda la animación .leaving

            } else {
                showFeedback("¡Error!", "bad");
                // Penalización sin animación de salida
                advanceTime(10);
            }
        }

        function advanceTime(seconds) {
            totalSeconds += seconds;
            
            // Calcular nuevas llegadas
            const currentMinute = totalSeconds / 60;
            const targetSize = getInterpolatedQueue(currentMinute);
            const diff = targetSize - globalQueue.length;
            
            if (diff > 0) {
                for(let i=0; i<diff; i++) {
                    globalQueue.push(totalSeconds);
                }
            }

            updateVisualsFromQueue(); // Aquí se redibuja la fila y los de atrás pasan adelante
            updateStats();
            updateClock();
        }

        // --- GESTIÓN VISUAL ---
        function updateVisualsFromQueue() {
            const container = document.getElementById('queueContainer');
            
            // Para mantener la suavidad, no borramos todo.
            // Pero para asegurar consistencia con la fila lógica, regeneraremos los primeros 5.
            // El truco visual es que al regenerar, el que era pos-1 ahora tendrá clase pos-0,
            // y CSS hará la transición de posición (transform) suavemente.
            
            container.innerHTML = ''; // Limpieza simple (en un framework usaríamos diffing)

            const limit = Math.min(globalQueue.length, 5);
            
            for(let i=0; i<limit; i++) {
                const arrival = globalQueue[i];
                // Determinar pedido consistente
                const orderIndex = Math.abs(Math.floor(arrival)) % 4;
                const order = MENU[orderIndex]; 
                
                const el = document.createElement('div');
                el.className = `customer pos-${i}`; // La clase define la posición X/Y/Scale
                el.dataset.order = order; // Guardar pedido en DOM
                
                // Variación visual
                const variant = (Math.abs(Math.floor(arrival)) % 3) + 1; 
                
                // Estado de ánimo
                let moodClass = '';
                let icon = '';
                if (i === 0) {
                    const wait = (totalSeconds - arrival) / 60;
                    if(wait > 60) { moodClass = 'mood-angry'; icon = '😡'; }
                }

                el.innerHTML = `
                    <div class="order-bubble">${order}</div>
                    <div class="c-body-group var-${variant} ${moodClass}">
                        <div class="c-head">
                            ${icon ? `<div style="position:absolute;top:-30px;left:10px;font-size:20px;">${icon}</div>` : ''}
                            <div class="c-eye eye-l"></div>
                            <div class="c-eye eye-r"></div>
                        </div>
                        <div class="c-torso"></div>
                    </div>
                `;
                
                container.appendChild(el);

                // Retraso para mostrar el globo del nuevo cliente en pos-0
                if (i === 0) {
                    setTimeout(() => {
                        const bubble = el.querySelector('.order-bubble');
                        if(bubble) bubble.classList.add('show');
                    }, 400); // Espera a que termine de deslizarse a la posición 0
                }
            }
        }

        // --- UTILIDADES ---
        function getInterpolatedQueue(min) {
            let i = 0;
            while (i < simulationData.length - 1 && simulationData[i+1].minute <= min) i++;
            const start = simulationData[i];
            const end = simulationData[i+1] || start;
            const progress = (min - start.minute) / (end.minute - start.minute || 1);
            return Math.round(start.queue + (end.queue - start.queue) * progress);
        }

        function updateStats() {
            const count = globalQueue.length;
            // Cálculo rápido de promedios
            let totalWait = 0, totalHunger = 0, totalStress = 0;
            if (count > 0) {
                // Muestreo de los primeros 50 para rendimiento
                const sampleSize = Math.min(count, 50);
                for(let i=0; i<sampleSize; i++) {
                    const waitMin = (totalSeconds - globalQueue[i]) / 60;
                    totalWait += waitMin;
                    totalHunger += Math.min(100, (waitMin / 40) * 100);
                    if (waitMin > 20) totalStress += Math.min(100, ((waitMin - 20) / 40) * 100);
                }
                var avgHunger = totalHunger / sampleSize;
                var avgStress = totalStress / sampleSize;
            }

            document.getElementById('totalQueueVal').innerText = count;
            document.getElementById('hungerVal').innerText = Math.round(avgHunger || 0) + '%';
            document.getElementById('stressVal').innerText = Math.round(avgStress || 0) + '%';

            updateBar('queueBar', count / 300 * 100);
            updateBar('hungerBar', avgHunger || 0);
            updateBar('stressBar', avgStress || 0);
        }

        function updateBar(id, pct) {
            const el = document.getElementById(id);
            el.style.width = `${Math.min(100, pct)}%`;
            el.className = 'progress-fill';
            if(pct < 40) el.classList.add('fill-safe');
            else if(pct < 70) el.classList.add('fill-warn');
            else el.classList.add('fill-danger');
        }

        function updateClock() {
            const totalMins = (11 * 60) + (totalSeconds / 60);
            const h = Math.floor(totalMins / 60);
            const m = Math.floor(totalMins % 60);
            document.getElementById('clock').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            document.getElementById('money').innerText = `$${money}`;
        }

        function showFeedback(txt, cls) {
            const el = document.getElementById('feedbackDisplay');
            el.innerText = txt;
            el.className = `feedback ${cls}`;
            void el.offsetWidth;
            el.style.animation = 'none';
            setTimeout(() => el.style.animation = '', 10);
        }

    </script>
</body>
</html>
